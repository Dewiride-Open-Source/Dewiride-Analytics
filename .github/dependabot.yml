# What is out of date, proposed one pull request at a time and proved by the build.
#
# Every proposal goes through exactly what a contributor's change goes through: the compile that
# is also the analysis, every suite, and the whole frontend gate. Nothing here merges anything.
# A proposal that turns the build red is the point — that is the release that would otherwise
# have failed on a machine with real traffic behind it.
#
# Nothing is proposed until a week after it was published. A package taken over at the registry
# is usually withdrawn within days, and this repository already asks its package manager to wait
# a day before installing anything; a week is that same caution with the proposal held back too.
#
# A security fix published inside that week is not proposed sooner, and GitHub's own security
# updates are left off: their proposals would rewrite the lockfile without `ee/` exactly as these
# do. A JavaScript advisory still arrives as an alert without anybody pushing, because GitHub reads
# the lockfile. A NuGet one never does: the dependency graph reads project files, which under
# central package management name no version and no transitive package, and automatic dependency
# submission, which would resolve them, is not turned on. What surfaces a NuGet advisory is the
# weekly scheduled run in build.yml — restore audits every package the free solution uses,
# transitive ones included, and warnings are errors here, so one that gains an advisory turns that
# run red within the week. The private repository's Build runs on the same day for the packages
# only the commercial edition restores. See docs/adr/0051-a-known-flaw-is-seen-within-the-week.md.
#
# Four things move by hand and are deliberately not watched, because each is chosen together with
# files no proposal could move, or because nothing here can propose it:
#
#   - The package manager. Dependabot does not edit `packageManager` in package.json, so it moves
#     in a dependency refresh, beside the lockfile it regenerates with `ee/` present. See
#     docs/adr/0050-the-package-manager-follows-its-stable-channel.md.
#   - The base images. The Node major is chosen with the runner in build.yml and `engines.node`;
#     the .NET major with global.json and the target framework. A tag like `24-alpine` can only
#     ever receive a new major, so watching it would propose exactly the moves that are not
#     taken this way.
#   - The two stores in compose.yaml. Both are pinned to the versions the product is tested
#     against, and the integration fixture pins the same two tags in code. A store moves with
#     its fixture, and on the machine serving traffic only after a backup.
#   - Stripe.net and Dewiride.EmailServer.Client, the client for the hosted service's own mail
#     service, in Directory.Packages.props. The projects that reference them are in the private
#     repository, so no project in this solution asks for them and they are never looked at here.
#
# One consequence of the two repositories is caught by the build rather than here. The lockfile
# describes both, and a machine without the private clone rewrites it without the private half —
# so every JavaScript proposal needs its lockfile regenerated with `ee/` present before it can
# merge, and `pnpm verify` says so on the proposal itself.

version: 2

updates:
  # The root is where the workflows are read from. The actions this repository defines for itself
  # live under .github/actions, which is never looked in unless it is named.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    # Every action, one proposal, wherever it is named. They are moved together or not at all, and
    # every one of them runs in the build the proposal itself goes through, except the three only the
    # WordPress plugin's release uses, which publish nothing until somebody approves the release.
    groups:
      actions:
        patterns:
          - "*"

  # The folder that directly holds the solution file, which is what the updater reads. The
  # version table it edits is at the root, and every project inherits it.
  - package-ecosystem: "nuget"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    # A dependency joins the first group it matches; everything unmatched is proposed on its own.
    # The analysers are left out on purpose: a new rule set can turn the build red on code that
    # was fine yesterday, and that is a proposal to read alone.
    groups:
      dotnet:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions.*"
          - "Npgsql.*"
          - "EFCore.NamingConventions"
      opentelemetry:
        patterns:
          - "OpenTelemetry.*"
      openiddict:
        patterns:
          - "OpenIddict.*"
      azure:
        patterns:
          - "Azure.*"
      # A MailKit release sets a floor under MimeKit, which the sender also uses directly, so the
      # two move together: a MailKit proposal alone, raising that floor above the pinned MimeKit,
      # would fail to restore.
      mailkit:
        patterns:
          - "MailKit"
          - "MimeKit"
      testing:
        patterns:
          - "xunit*"
          - "AwesomeAssertions"
          - "NSubstitute"
          - "NetArchTest.*"
          - "Testcontainers.*"

  # The WordPress plugin's development tools: the coding standard, the analyser, the test runner and
  # what they need. Nothing here ships — the plugin itself has no dependencies — but every check the
  # plugin goes through is one of them. A week's small moves arrive as one proposal; a new major of
  # anything is proposed on its own.
  - package-ecosystem: "composer"
    directory: "/integrations/wordpress-plugin"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      tools:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Two majors stay where they are, each held by something no proposal could move. PHPUnit stays
    # on 9, the last release that runs on PHP 7.4, the oldest PHP the plugin supports and the one
    # its tests are run on as well. PHP_CodeSniffer stays on 3, which is what the WordPress coding
    # standard is written against; it moves when a release of the standard does.
    ignore:
      - dependency-name: "phpunit/phpunit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "squizlabs/php_codesniffer"
        update-types: ["version-update:semver-major"]

  # The SDK pinned in global.json. Within one major the pin can move freely: the image the
  # engine is built in carries the newest SDK of that major, and `rollForward: latestPatch`
  # accepts a newer patch but not a newer feature band, so a pin left behind is a build that
  # fails inside the image while passing everywhere else.
  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build"
      include: "scope"
    ignore:
      - dependency-name: "dotnet-sdk"
        update-types: ["version-update:semver-major"]

  # Every JavaScript version lives in the catalog in pnpm-workspace.yaml, and that is what is
  # edited. The versions there are exact, and `increase` keeps them exact.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    cooldown:
      default-days: 7
    versioning-strategy: "increase"
    commit-message:
      prefix: "build"
      include: "scope"
    # A dependency joins the first group it matches. The last group takes every minor and patch
    # release nothing above has claimed, so a week's small moves arrive as one proposal, while a
    # new major of anything is proposed on its own. esbuild is kept out of it: it is pre-1.0 and
    # a minor release may break the beacon, which is worth reading alone. A Biome release also
    # moves the `$schema` line in biome.json, by hand, on the same proposal.
    groups:
      framework:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      typescript:
        patterns:
          - "typescript"
          - "typescript-eslint"
      lint:
        patterns:
          - "eslint"
          - "eslint-plugin-*"
          - "@biomejs/*"
          - "prettier"
      testing:
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "jsdom"
          - "@testing-library/*"
          - "@playwright/*"
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "esbuild"
        update-types:
          - "minor"
          - "patch"
    # TypeScript stays on 6.x: the lint bridge declares a range that stops below the next major,
    # and `pnpm verify` asserts the resolved version. The Node type definitions stay on the major
    # the images and the build run on; they move with the base images, by hand, not by proposal.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
