# One workspace for every JavaScript package in the repository, and one dependency-version table.
#
# The root sits here rather than in `frontend/` because the packages are not all the dashboard's.
# The tracker is MIT and is pasted into other people's websites; the dashboard is AGPL. Keeping
# them in separate top-level directories is what makes that boundary readable, and a workspace
# cannot reach outside its own root to find a package.
#
# Members are listed one by one rather than matched with a pattern. A pattern at the repository
# root would sweep in `ee/`, which is a separate private repository that is simply absent from an
# ordinary checkout — and an install that fails depending on who cloned it is worse than a list
# that has to be edited when a package is added.
packages:
  - frontend/apps/web
  - tracker
  # Absent from an ordinary checkout, and pnpm passes over a member that is not there. Both are
  # named rather than matched by a pattern for the reason above: a pattern would sweep in whatever
  # else somebody had cloned into ee/.
  #
  # The first is the half of the dashboard only the commercial edition compiles, and it has to be a
  # member of this workspace rather than of one of its own: those screens import React, and a second
  # copy of React in one bundle produces hooks that fail at run time. The second is the public
  # website, which is an application of its own and shares no bundle with anything here — it is a
  # member so that one lockfile and one version table serve both repositories.
  #
  # Their lockfile entries stay behind on a checkout without them, and a frozen install passes over
  # a recorded member whose directory is absent, which is what lets the free product install alone.
  # The package manager may move only while that stays true: see
  # docs/adr/0050-the-package-manager-follows-its-stable-channel.md.
  - ee/frontend/edition
  - ee/frontend/apps/site

# Every version lives in the catalog below and packages refer to it as `catalog:`, so an upgrade
# is a single line and two packages can never drift onto different copies of React.

# A dependency may only run install scripts if it is named here as `true`. The list is short on
# purpose: each such entry is a package that unpacks a platform-specific binary and does nothing
# else. Biome is named as `false`: the package manager asks for a decision about it on every
# install, and it has nothing to run — its binary arrives as a platform-specific optional
# dependency.
allowBuilds:
  "@biomejs/biome": false
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true

catalog:
  # Framework
  next: 16.4.2
  react: 19.3.1
  react-dom: 19.3.1

  # Language. Pinned to 6.x deliberately — see scripts/assert-typescript-version.mjs.
  typescript: 6.0.3
  # The major follows the Node major the images and the build run on, so the compiler describes the
  # runtime that ships rather than one that does not.
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0

  # Presentation
  tailwindcss: 4.3.3
  "@tailwindcss/postcss": 4.3.3
  next-themes: 0.4.6
  lucide-react: 1.61.0
  "@radix-ui/react-popover": 1.3.1
  clsx: 2.1.1
  tailwind-merge: 3.7.0
  class-variance-authority: 0.7.1
  echarts: 6.1.0

  # Behaviour
  next-intl: 4.14.9
  nuqs: 2.10.2
  zod: 4.6.7
  "@tanstack/react-query": 5.104.5

  # Build. Pinned exactly rather than to a range: esbuild is pre-1.0 and treats a minor release as
  # allowed to break, and this one compiles a script that goes on other people's websites.
  esbuild: 0.28.2

  # Quality
  eslint: 10.13.0
  "@next/eslint-plugin-next": 16.4.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-jsx-a11y: 6.10.2
  typescript-eslint: 8.72.0
  "@biomejs/biome": 2.6.2
  prettier: 3.9.10

  # Tests
  # The runner asks for its build engine as a peer and does not carry it itself, so its version is
  # stated here like every other rather than left to whatever a regeneration resolves.
  vite: 8.3.5
  vitest: 5.0.5
  "@vitest/coverage-v8": 5.0.5
  "@vitejs/plugin-react": 6.1.2
  jsdom: 30.1.3
  "@testing-library/react": 16.3.3
  "@testing-library/jest-dom": 7.0.1
  "@testing-library/user-event": 14.6.8
  "@playwright/test": 1.64.1

# Newly published versions are held back by default, so a package compromised at the registry has
# to survive a waiting period before it can be installed here. A version deliberately taken before
# that period has elapsed is listed under `minimumReleaseAgeExclude`, as `name@version`, and the
# entry is removed again once that version has left the lockfile.
